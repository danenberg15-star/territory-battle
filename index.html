<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cops Vs. Thieves: Territory Battle</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 1. Base Styles & General Design Consistency[cite: 4] */
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; color: white; user-select: none; -webkit-user-select: none; 
        }
        #map { height: 100%; width: 100%; position: absolute; top: 0; z-index: 1; display: none; }
        
        /* 2. Screens & Layout[cite: 4] */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; padding: 20px; box-sizing: border-box; }
        #lobby-screen { display: none; justify-content: flex-start; padding-top: 50px; }
        
        /* 3. Rounded Design Consistency (Inputs & Buttons)[cite: 4] */
        input { 
            width: 100%; max-width: 300px; padding: 15px; margin-bottom: 15px; 
            border-radius: 50px; /* מעוגל מלא[cite: 4] */
            border: 1px solid #38bdf8; background: #1e293b; color: white; 
            font-size: 18px; text-align: center; box-sizing: border-box; 
        }
        
        .btn { 
            width: 100%; max-width: 300px; padding: 18px; 
            border-radius: 50px; /* מעוגל מלא[cite: 4] */
            border: none; font-size: 18px; font-weight: bold; color: white; 
            cursor: pointer; margin-bottom: 15px; transition: 0.2s; 
            text-align: center; display: flex; align-items: center; justify-content: center; 
        }
        .btn-blue { background: #1e40af; border-bottom: 4px solid #1e3a8a; }
        .btn-red { background: #991b1b; border-bottom: 4px solid #7f1d1d; }
        .btn-green { background: #10b981; font-size: 15px; padding: 15px; line-height: 1.4; max-width: 350px; width: 100%; margin: 15px 0 0 0; }
        
        /* 4. Brand Elements[cite: 4] */
        .game-logo { width: 140px; height: 140px; margin-bottom: 10px; border-radius: 30px; filter: drop-shadow(0 0 15px #38bdf8); }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 25px; text-align: center; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); line-height: 1.2; }
        h1 span { font-size: 28px; display: block; color: white; }

        /* 5. Advanced Rounded Toggle[cite: 4] */
        .mode-toggle-container {
            display: flex; background: #1e293b; border-radius: 50px; padding: 4px; 
            width: 100%; max-width: 300px; margin-bottom: 20px; position: relative; 
            border: 1px solid #38bdf8; box-sizing: border-box;
        }
        .mode-option {
            flex: 1; text-align: center; padding: 12px 0; font-size: 14px; 
            font-weight: bold; color: #94a3b8; cursor: pointer; z-index: 1; transition: 0.3s;
        }
        .mode-option.active { color: white; }
        .mode-slider {
            position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); 
            height: calc(100% - 8px); background: #38bdf8; border-radius: 50px; 
            transition: 0.3s ease-in-out; z-index: 0;
        }
        [dir="rtl"] .mode-slider { left: auto; right: 4px; }
        .mode-toggle-container.single-active .mode-slider { transform: translateX(-100%); }
        [dir="rtl"] .mode-toggle-container.single-active .mode-slider { transform: translateX(100%); }

        /* 6. Functional Layers (Unchanged from index_28.html)[cite: 4] */
        #map { position: absolute; top: 0; z-index: 1; }
        #drawing-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2500; display: none; }
        #chat-container { position: absolute; top: 70px; width: 45%; max-width: 210px; z-index: 5000; display: none; }
        #controls-container { display: none; position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); z-index: 5500; }
        #floating-stats { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: none; z-index: 4000; }
    </style>
</head>
<body>
    <button id="lang-toggle" onclick="toggleLanguage()" style="position:absolute; top:15px; right:15px; z-index:4102; background:rgba(30, 41, 59, 0.8); color:white; border-radius:50%; width:40px; height:40px; border:1px solid #38bdf8;">🌐</button>

    <div id="login-screen" class="screen">
        <img src="LOGO 512.webp" alt="Logo" class="game-logo">
        <h1 id="lbl-main-title">Cops Vs. Thieves:<br><span>Territory Battle</span></h1>
        
        <input type="text" id="player-name" placeholder="שם השחקן" />
        
        <!-- עטיפה לטוגל שיוזרק ע"י ה-JS -->
        <div id="mode-toggle-wrapper" style="width: 100%; display: flex; justify-content: center;"></div>
        
        <input type="number" id="room-code-input" placeholder="קוד המשחק" />
        
        <button class="btn btn-blue" id="btn-join-room" onclick="joinRoom()">הצטרף למשחק קיים</button>
        <button class="btn btn-red" id="btn-create-room" onclick="createRoom()">התחל משחק חדש</button>
    </div>

    <!-- מסך הלובי נשאר זהה במבנה שלו מ-index_28.html[cite: 4] -->
    <div id="lobby-screen" class="screen">
        <h2 id="lbl-lobby-title">לובי המתנה</h2>
        <div style="display: flex; align-items: center; width: 100%; max-width: 350px; margin-bottom: 20px;">
            <div class="room-code-box" style="background: #1e293b; border: 2px dashed #38bdf8; padding: 15px; border-radius: 12px; font-size: 24px; font-weight: bold; text-align: center; flex-grow: 1;">קוד: <span id="display-room-code">----</span></div>
            <button class="btn-whatsapp-icon" onclick="shareWhatsApp()" style="background: #25D366; border: none; border-radius: 50%; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: 15px;"><svg viewBox="0 0 24 24" width="30" height="30" fill="white"><path d="M12.031 0C5.385 0 0 5.385 0 12.031c0 2.128.552 4.195 1.6 6.02L.053 24l6.113-1.603c1.764.954 3.754 1.458 5.865 1.458 6.646 0 12.031-5.385 12.031-12.031S18.677 0 12.031 0zm3.626 17.15c-.156.44-1.295.992-1.847 1.054-.537.06-1.127.186-3.413-.761-2.92-1.21-4.787-4.225-4.93-4.417-.143-.192-1.178-1.568-1.178-2.986 0-1.418.736-2.115 1.002-2.392.266-.277.674-.352.887-.352.213 0 .426.002.605.009.213.008.497-.083.775.589.284.685.952 2.321 1.036 2.493.084.172.143.376.035.592-.108.216-.164.352-.326.544-.164.192-.345.426-.497.589-.168.176-.347.37-.148.712.199.342.885 1.463 1.895 2.361 1.305 1.159 2.404 1.516 2.748 1.673.344.157.545.132.748-.101.203-.233.882-1.025 1.118-1.378.236-.353.473-.294.787-.176.314.118 1.986.937 2.327 1.107.341.17.568.256.653.398.085.142.085.83-.071 1.27z"/></svg></button>
        </div>
        <div style="display: flex; width: 100%; max-width: 350px; flex-grow: 1;">
            <div class="team-list" id="list-cops" style="background: #1e293b; border-radius: 12px; padding: 10px; flex: 1; display: flex; flex-direction: column; margin: 5px;"><div style="color:#3b82f6; font-weight:bold; text-align:center; margin-bottom: 10px;">שוטרים 👮‍♂️</div><div id="players-cops"></div></div>
            <div class="team-list" id="list-thieves" style="background: #1e293b; border-radius: 12px; padding: 10px; flex: 1; display: flex; flex-direction: column; margin: 5px;"><div style="color:#ef4444; font-weight:bold; text-align:center; margin-bottom: 10px;">גנבים 🥷</div><div id="players-thieves"></div></div>
        </div>
        <button class="btn btn-green" id="btn-start-game" style="display:none;" onclick="startGame()">התחל משחק</button>
    </div>

    <div id="map"></div>
    <div id="drawing-container"><canvas id="drawing-canvas"></canvas></div>
    <div id="floating-stats"></div>
    <div id="chat-container"></div>
    <div id="controls-container"></div>

    <!-- סקריפטים[cite: 4] -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="firebase-init.js"></script>
    <script src="lobby.js"></script>
    <script src="game-core.js"></script>
    <script src="game-arena.js"></script>
    <script src="game-play.js"></script>
</body>
</html>
